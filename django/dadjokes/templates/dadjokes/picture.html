<!--Description: Template for displaying a single picture in dadjokes app -->
{% extends "dadjokes/base.html" %} {% block content %} 

<div>
  <h1>Picture</h1>
  <div>
    <img src="{{ picture.image.url }}" />
    <p>{{ picture.contributor }}</p>
    <p><small>{{ picture.timestamp }}</small></p>
  </div>
  {% empty %}
  <p>No picture found.</p>
  {% endfor %}

{% endblock %}
