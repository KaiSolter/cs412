<!--Description: Template for displaying all jokes in dadjokes app -->
{% extends "dadjokes/base.html" %} {% block content %} 

<div>
  <h1>All Jokes</h1>
  {% for joke in jokes %}
  <div>
    <p>{{ joke.text }}</p>
    <p>{{ joke.contributer }}</p>
    <p><small>{{ joke.timestamp }}</small></p>
  </div>
  {% empty %}
  <p>No jokes found.</p>
  {% endfor %}

{% endblock %}
