<!--Description: Template for displaying a single joke and image in dadjokes app -->
{% extends "dadjokes/base.html" %} {% block content %} 

<div>
  <h1>Joke</h1>
    <p>{{ joke.text }}</p>
    <p>{{ joke.contributer }}</p>
    <p><small>{{ joke.timestamp }}</small></p>
    <h1>Picture</h1>
    <img src="{{ picture.image_url }}" />
</div>

{% endblock %}
