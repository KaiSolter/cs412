<!--Description: Template for displaying a single joke in dadjokes app -->
{% extends "dadjokes/base.html" %} {% block content %} 

<div>
  <h1>Joke</h1>
    <p>{{ joke.text }}</p>
    <p>{{ joke.contributor }}</p>
    <p><small>{{ joke.timestamp }}</small></p>
  </div>
  {% empty %}
  <p>No jokes found.</p>
  {% endfor %}

{% endblock %}
