<!--Description: Template for logging in to the final project app -->

{% extends 'project/base.html' %}
{% block content %}
<h1>Login</h1>
<form action="{% url 'login' %}" method="POST">
    {% csrf_token %}

    <div>
        {{ form.username.label_tag }}
        {{ form.username }}
    </div>

    <div>
        {{ form.password.label_tag }}
        {{ form.password }}
    </div>

    <input type="submit" value="Login" />

    {% if request.GET.next %}
        <input type="hidden" name="next" value="{{ request.GET.next }}" />
    {% else %}
        <input type="hidden" name="next" value="{% url 'profile_self' %}" />
    {% endif %}
</form>
{% endblock %}
