<!--Description: Template for displaying profile details -->
{% extends 'project/base.html' %}

{% block content %}
    <h2>Profile Details</h2>
    <p><strong>Username:</strong> {{ profile.username|default:profile.user.username }}</p>
    <p><strong>Account:</strong> {{ profile.user.username }}</p>
    <p><strong>Bio:</strong> {{ profile.bio|default:'No bio yet.' }}</p>
    <p><strong>Joined:</strong> {{ profile.join_date }}</p>
    <p><a href="{% url 'profile_edit' %}">Edit profile</a></p>
{% endblock %}
