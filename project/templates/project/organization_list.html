<!--Description: Template for displaying a list of organizations -->

{% extends 'project/base.html' %}
{% block content %}
<h1>Organizations</h1>
<div>    
{% for organization in organizations %}
        <div>
            <a href="{% url 'organization' organization.pk %}">
                <h1>{{ organization.name }}</h1>
            </a>
        </div>
    {% endfor %}
</div>
{% endblock %}
