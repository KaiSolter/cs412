<!-- Description: Template for updating profile fields -->
{% extends 'project/base.html' %}

{% block content %}
<h2>Edit Profile</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<p><a href="{% url 'profile_self' %}">Back to profile</a></p>
{% endblock %}
