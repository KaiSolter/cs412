<!--Description: Template for displaying a list of topics -->

{% extends 'project/base.html' %}
{% block content %}
<h1>Topics</h1>
<div>    
{% for topic in topics %}
        <div>
            <a href="{% url 'topic' topic.pk %}">
                <h1>{{ topic.topic }}</h1>
            </a>
        </div>
    {% endfor %}
</div>
{% endblock %}
