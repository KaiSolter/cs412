{% extends 'mini_insta/base.html' %} {% block content%}
<h1>Profiles</h1>

<div>
  {% for profile in profiles %}
  <div>
    <div>
      <h2>{{ profile.display_name }}</h2>
      <h2>{{profile.username}}<h2>
    </div>
   
    <a href="{% url 'profile' profile.pk %}">
      <img src="{{profile.profile_image_url}}" alt="" />
    </a>
  </div>
  <hr />
  {% endfor %}
</div>
{% endblock %}
