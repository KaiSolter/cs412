<!--Description: Template for updating a post in mini_insta app -->
{% extends "mini_insta/base.html" %} {% block content %}
<h1>Update Post</h1>
<form
  action="{% url 'update_post' post.pk %}"
  method="POST"
  enctype="multipart/form-data"
>
  {% csrf_token %}
  <table>
    {{form.as_table}}
  </table>
  <input type="submit" name="submit" value="Submit" />
  <input
    type="button"
    name="cancel"
    value="Cancel"
    onclick="window.location.href='{% url 'profile_self' %}'"
  />
</form>
{% endblock %}
