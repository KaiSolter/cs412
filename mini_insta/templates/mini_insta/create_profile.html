<!--Description: Template for creating a profile in mini_insta app -->
{% extends "mini_insta/base.html" %} {% block content %}
<h1>Create Profile</h1>
<form
  action="{% url 'create_profile' %}"
  method="POST"
  enctype="multipart/form-data"
>
  {% csrf_token %}
  <h2>User Information</h2>
  <table>
    {{user_creation_form.as_table}}
  </table>

  <h2>Profile Information</h2>
  <table>
    {{form.as_table}}
  </table>

  <input type="submit" name="submit" value="Submit" />
  <input
    type="button"
    name="cancel"
    value="Cancel"
    onclick="window.location.href='{% url 'profile_self' %}'"
  />
</form>
{% endblock %}
